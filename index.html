<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navratri Utsav - Royal Haveli Experience Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-indigo: #0d021a;
            --bg-card: #18082a;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --accent-crimson: #800020;
            --text-light: #f8f5f0;
            --glass-bg: rgba(24, 8, 42, 0.85);
            --glass-border: rgba(212, 175, 55, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-indigo);
            color: var(--text-light);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(128, 0, 32, 0.45) 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(212, 175, 55, 0.15) 0%, transparent 60%);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Petals */
        .petal {
            position: fixed;
            background: #ffbf00;
            border-radius: 150% 0 150% 0;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            animation: floatPetal 12s linear infinite;
        }

        @keyframes floatPetal {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        /* Header */
        header {
            background: rgba(13, 2, 26, 0.95);
            border-bottom: 2px solid var(--gold-primary);
            padding: 20px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .audio-btn {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .audio-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-indigo);
